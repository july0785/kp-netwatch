[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-netwatch"
version = "0.1.0"
description = "Passive monitor of the DPRK (KP) public internet footprint: BGP, certificate transparency, DNS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
kpnetwatch = "kpnetwatch.cli:main"

[tool.setuptools]
packages = ["kpnetwatch"]
